# Fork-only review verification; this wrapper is not part of upstream PR #480.
name: iOS daily task review
on:
  workflow_dispatch:
    inputs:
      suite:
        description: Verification suite
        type: choice
        options: [app, node, installer, latest-main]
        default: app
  workflow_call:
    inputs:
      version: { type: string, required: true }
      build: { type: string, required: true }
      editions: { type: string, required: false, default: external }
permissions:
  contents: read
jobs:
  app:
    if: github.event.inputs.suite != 'node' && github.event.inputs.suite != 'installer'
    runs-on: xcode-27
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      # Verify the PR merge candidate before publishing it to the PR branch.
      - name: Use the newest Xcode
        shell: bash
        run: |
          XCODE="$(ls -d /Applications/Xcode_*.app | grep -v -i beta | sort -V | tail -1)"
          sudo xcode-select -s "$XCODE/Contents/Developer"
          xcodebuild -version
      - name: Routine attribution and migration regressions from latest main
        if: github.event.inputs.suite == 'latest-main'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build
          swift test --package-path native/ios/PokiCore --filter RoutineTests 2>&1 | tee build/routines.log
          grep -q 'Executed 22 tests, with 0 failures' build/routines.log
      - id: rust
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cargo/registry
            native/launcher/target
          key: launcher-${{ hashFiles('native/launcher/src/**', 'native/launcher/include/**', 'native/launcher/Cargo.*', 'native/launcher/fetch-idevice.sh', 'native/patches/**', 'bin/setup', 'desktop/core/src/**', 'desktop/core/Cargo.*') }}
          restore-keys: launcher-
      - uses: actions/cache/restore@v4
        with:
          path: |
            build/app-external
            build/app-local
            ~/Library/Developer/Xcode/DerivedData/ModuleCache.noindex
          key: ipa-xcode27-${{ github.sha }}
          restore-keys: ipa-xcode27-
      - uses: actions/cache/restore@v4
        with:
          path: build/review-sim
          key: pr480-sim-xcode27-${{ github.sha }}
          restore-keys: pr480-sim-xcode27-
      - name: Prepare the simulator build dependencies
        shell: bash
        run: |
          set -euo pipefail
          native/launcher/fetch-idevice.sh
          rustup update stable --no-self-update && rustup default stable
          rustup target add aarch64-apple-ios-sim
          cargo build --release --locked --target aarch64-apple-ios-sim --manifest-path native/launcher/Cargo.toml
          native/ios-app/scripts/make-assets.sh
          command -v xcodegen >/dev/null || brew install xcodegen
          xcodegen generate --spec native/ios-app/project-external.yml
          command -v gtimeout >/dev/null || brew install coreutils
      - name: Build signed merged app on a disposable Simulator
        shell: bash
        run: |
          set -euo pipefail
          SDK="$(xcrun --sdk iphonesimulator --show-sdk-version)"
          RUNTIME=$(xcrun simctl list runtimes -j | python3 -c '
          import json,re,sys
          sdk=tuple(map(int,sys.argv[1].split(".")))
          metadata=json.load(sys.stdin)["runtimes"]
          versions={r["identifier"]:tuple(map(int,r["version"].split("."))) for r in metadata if r.get("isAvailable",False) and "iOS-" in r["identifier"]}
          standard=lambda r: re.fullmatch(r".*\.iOS-\d+(?:-\d+)*",r) is not None
          runtimes=sorted((r for r in versions if versions[r]<=sdk),key=lambda r:(versions[r],standard(r)),reverse=True)
          print(runtimes[0])' "$SDK")
          TYPE=$(xcrun simctl list devicetypes -j | python3 -c 'import json,sys; ds=json.load(sys.stdin)["devicetypes"]; print(next(d["identifier"] for d in ds if d["name"]=="iPhone 17 Pro"))')
          UDID=$(xcrun simctl create Poki-PR480-merge "$TYPE" "$RUNTIME")
          echo "TEST_UDID=$UDID" >> "$GITHUB_ENV"
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
          # Follow native/ios-app/scripts/app-tests.sh: ad-hoc signing and the app-hosted injector.
          # The earlier run already passed all 30 feature tests and three signing-layout tests.
          xcodebuild build-for-testing -project native/ios-app/PokiExternal.xcodeproj -scheme Poki -configuration Debug \
            -destination "platform=iOS Simulator,id=$UDID" -derivedDataPath build/review-sim \
            -clonedSourcePackagesDirPath build/app-external/SourcePackages \
            CODE_SIGNING_ALLOWED=YES CODE_SIGN_IDENTITY=- CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM= PROVISIONING_PROFILE_SPECIFIER= \
            ARCHS=arm64 2>&1 | tee build/signed-sim-build.log | grep --line-buffered -E 'error:|BUILD (SUCCEEDED|FAILED)|\*\* '
          APP="$GITHUB_WORKSPACE/build/review-sim/Build/Products/Debug-iphonesimulator/Poki.app"
          BUNDLE=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Info.plist")
          X="$(xcode-select -p)/Platforms/iPhoneSimulator.platform/Developer"
          xcrun simctl install "$UDID" "$APP"
          xcrun simctl privacy "$UDID" grant location-always "$BUNDLE"
          echo "TEST_APP=$APP" >> "$GITHUB_ENV"
          echo "TEST_BUNDLE=$BUNDLE" >> "$GITHUB_ENV"
      - uses: actions/cache/save@v4
        with:
          path: build/review-sim
          key: pr480-sim-xcode27-${{ github.sha }}
      - name: Daily-task safety regressions, remaining History queries, and actual merged pages
        if: github.event.inputs.suite != 'latest-main'
        shell: bash
        run: |
          set -euo pipefail
          UDID="$TEST_UDID"; APP="$TEST_APP"; BUNDLE="$TEST_BUNDLE"
          X="$(xcode-select -p)/Platforms/iPhoneSimulator.platform/Developer"
          : > build/daily-task-simulator.log
          for spec in \
            DailyTaskTests/testClaimIsPersistedBeforeSubmissionAndSurvivesReopening \
            DailyTaskTests/testOnlyLatestDueOccurrenceCanRunAndTomorrowCanRunAgain \
            DailyTaskTests/testEditingOrCancellingRejectsAnAlreadyDeliveredNotification \
            DailyTaskTests/testTwoSameTimeTasksWaitInTapOrderAndClaimIndependently \
            DailyTaskTests/testEditingKeepsTheDueClaimAndRemovingLeavesOthersWaiting \
            DailyTaskTests/testAnEditInFlightCannotResurrectADeletedSchedule \
            DailyTaskTests/testAtCapacityEditingIsAllowedButAddingDoesNotReplaceAnyTask \
            DailyTaskTests/testPersistenceFailureDoesNotSubmit \
            DailyTaskTests/testUnreadableSchedulesCannotBeOverwrittenAndRecoverOnRetry \
            DailyTaskTests/testInvalidExistingSchedulesAreNotReplacedWithAnEmptyList \
            DailyTaskTests/testWestwardTravelDoesNotSkipTheNextLocalDueInstant \
            DailyTaskSchedulerTests/testForegroundTickSubmitsOnceAndALaterTapCannotReplayIt \
            DailyTaskSchedulerTests/testBackgroundDueTimeRequiresATapEvenAfterReturningToForeground \
            DailyTaskSchedulerTests/testShortBackgroundRoundTripWithoutATimerTickRequiresATap \
            DailyTaskSchedulerTests/testLockedOrUnknownLockStateCannotQueueAnAutomaticRun \
            DailyTaskSchedulerTests/testBusyAtDueTimeLeavesTheOccurrenceForNotification \
            DailyTaskSchedulerTests/testTwoTasksDueTogetherQueueBeforeTheFirstMakesPokiBusy \
            DailyTaskSchedulerTests/testColdStartAndLongSuspensionDoNotBackfillAutomaticRuns \
            DailyTaskSchedulerTests/testTappedRequestWaitsForForegroundAndReadinessWithoutBecomingAutomatic \
            DailyTaskSchedulerTests/testRestartingTheClockAfterAnIdlePeriodObservesTheNextCrossing \
            DailyTaskRemindersTests/testRefreshRegistersARepeatingRequestAndSkipsTheClaimedOccurrence \
            DailyTaskRemindersTests/testDeniedAuthorizationDoesNotAddOrLogEveryTick \
            DailyTaskRemindersTests/testFailedAddsBackOffAndRecoverWithoutPerSecondLogs \
            DailyTaskRemindersTests/testClaimWhileAddIsInFlightCannotRestoreTodaysReminder \
            DailyTaskRemindersTests/testDeletionWhileAddIsInFlightRemovesTheStaleRequest \
            AutomaticTaskApprovalsTests/testAutomaticFloorCannotDisableAskingOrWeakenAStrongerLevel \
            AutomaticTaskApprovalsTests/testEndingAnOlderRunCannotDropANewerRunsFloor \
            ChatHarnessTests/testDailyTaskContinuePrefixesReachTheModelAsNewTasks \
            ChatHarnessTests/testAutomaticSendKeepsApprovalFloorUntilCancellationWithoutChangingPreferences \
            ChatHarnessTests/testTimeQualifiedContinuationRequiresTheOwnersChoice \
            ChatHarnessTests/testUnknownContinuationAsksBeforeStartingTheModel \
            ChatHarnessTests/testAmbiguousContinuationWaitsForTheOwnersChoice \
            LanguageTests/testNotificationActionsRefreshWithLanguageWithoutChangingTheirMeaning \
            ScreenHistoryTests/testScreenHistoryToolQueriesStoredReadsByTimeSpanAppAndKeyword \
            ScreenHistoryTests/testLiveModelRequestsRefreshHistoryToolsAndDiscardRevokedEvidence \
            PR480MergePageEvidenceTests/testMergedSettingsAndDestinationsRender; do
            LOG="build/${spec//\//-}.log"
            xcrun simctl terminate "$UDID" "$BUNDLE" >/dev/null 2>&1 || true
            SIMCTL_CHILD_DYLD_INSERT_LIBRARIES="$X/usr/lib/libXCTestBundleInject.dylib" \
            SIMCTL_CHILD_XCTestBundlePath="$APP/PlugIns/PokiTests.xctest" \
            SIMCTL_CHILD_DYLD_FRAMEWORK_PATH="$X/Library/Frameworks:$X/Library/PrivateFrameworks" \
            SIMCTL_CHILD_DYLD_LIBRARY_PATH="$X/usr/lib" \
              gtimeout 180 xcrun simctl launch --console-pty "$UDID" "$BUNDLE" -XCTest "$spec" -AppleLanguages '(en)' -AppleLocale en_US > "$LOG" 2>&1 &
            TEST_PID=$!
            for second in $(seq 1 180); do
              if grep -q 'Executed 1 test' "$LOG" || ! kill -0 "$TEST_PID" 2>/dev/null; then break; fi
              sleep 1
            done
            xcrun simctl terminate "$UDID" "$BUNDLE" >/dev/null 2>&1 || true
            wait "$TEST_PID" || true
            cat "$LOG" >> build/daily-task-simulator.log
            grep -E '^Test Suite|^Test Case|error:|Executed' "$LOG" || true
            grep -Eq "Test Case .*${spec##*/}.*passed" "$LOG"
            grep -q 'Executed 1 test, with 0 failures' "$LOG"
          done
      - name: Collect actual rendered page evidence before deleting the Simulator
        if: always() && env.TEST_BUNDLE != ''
        shell: bash
        run: |
          set -euo pipefail
          DATA=$(xcrun simctl get_app_container "$TEST_UDID" "$TEST_BUNDLE" data)
          mkdir -p build/merge-ui
          if [ -d "$DATA/Documents/PR480MergePageEvidence" ]; then
            cp -R "$DATA/Documents/PR480MergePageEvidence/." build/merge-ui/
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pr480-merge-ui
          path: build/merge-ui/
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: daily-task-review-evidence
          path: |
            build/daily-task-tests.log
            build/daily-task-simulator.log
            build/app-external.log
            build/signed-sim-build.log
            build/routines.log
            build/daily-task-review.xcresult
          if-no-files-found: warn
      - name: Remove only the Simulator created by this run
        if: always() && env.TEST_UDID != ''
        run: |
          xcrun simctl shutdown "$TEST_UDID" >/dev/null 2>&1 || true
          xcrun simctl delete "$TEST_UDID"
  node-checks:
    if: github.event.inputs.suite == 'node' || github.event.inputs.suite == 'installer'
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Use the newest Xcode
        shell: bash
        run: |
          XCODE="$(ls -d /Applications/Xcode_*.app | grep -v -i beta | sort -V | tail -1)"
          sudo xcode-select -s "$XCODE/Contents/Developer"
          xcodebuild -version
      - run: npm ci --no-audit --no-fund
      - if: github.event.inputs.suite == 'node'
        run: npm ci --prefix agent --no-audit --no-fund
      - name: Full npm regression suite with Xcode tools
        if: github.event.inputs.suite == 'node'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build
          npm test 2>&1 | tee build/npm-test.log
      - name: Isolated check of the installer fixture cleanup failure
        if: github.event.inputs.suite == 'installer'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build
          node --test --test-name-pattern='the Apple code command in the prompt works pasted into a new Terminal outside the checkout' test/install-iphone.test.mjs 2>&1 | tee build/npm-test.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pr480-npm-tests
          path: build/npm-test.log
          if-no-files-found: warn
